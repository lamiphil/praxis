<!doctype html>
<html lang="fr">
<head>
{{template "head" "Calendrier"}}
</head>
<body>
{{template "nav" "calendar"}}

  <main id="main" class="page narrow">
    <header class="month-header">
      <a class="icon-button" href="/calendar?month={{.Previous}}" aria-label="Mois précédent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <div>
        <p class="eyebrow">Historique</p>
        <h1>{{.MonthLabel}}</h1>
      </div>
      <a class="icon-button" href="/calendar?month={{.Next}}" aria-label="Mois suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
    </header>

    <div class="calendar">
      <span class="weekday" aria-hidden="true">Lun</span><span class="weekday" aria-hidden="true">Mar</span><span class="weekday" aria-hidden="true">Mer</span><span class="weekday" aria-hidden="true">Jeu</span><span class="weekday" aria-hidden="true">Ven</span><span class="weekday" aria-hidden="true">Sam</span><span class="weekday" aria-hidden="true">Dim</span>
      {{range .Cells}}
        {{if .Date}}
          {{if .Future}}
            <span class="calendar-day future" aria-hidden="true"><span>{{.Day}}</span><span class="mark"></span></span>
          {{else}}
            <a class="calendar-day {{.Status}}{{if .Today}} today{{end}}" href="/day?date={{.Date}}" aria-label="{{.Label}}"{{if .Today}} aria-current="date"{{end}}><span>{{.Day}}</span><span class="mark" aria-hidden="true"></span></a>
          {{end}}
        {{else}}
          <span class="calendar-day blank" aria-hidden="true"></span>
        {{end}}
      {{end}}
    </div>
    <div class="legend" aria-hidden="true">
      <span><i class="swatch rated"></i> Notée</span>
      <span><i class="swatch unrated"></i> Sans note</span>
      <span><i class="swatch"></i> Non enregistrée</span>
    </div>
  </main>
</body>
</html>
