<!doctype html>
<html lang="fr">
<head>
{{template "head" "Connexion"}}
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">Pratique intentionnelle</p>
    <h1>Praxis</h1>
    <p class="muted">Un geste simple pour marquer ta journée.</p>
    {{if .Error}}<p class="alert" role="alert">Mot de passe incorrect. Réessaie.</p>{{end}}
    <form method="post" action="/login" class="stack">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entrer</button>
    </form>
  </main>
</body>
</html>
